services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_agent}
      POSTGRES_USER: ${POSTGRES_USER:-resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume}
    ports:
      # Local-only binding: do not expose a development database to the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - resume_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  resume_agent_pgdata:
