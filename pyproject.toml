[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-agent"
version = "0.1.0"
description = "Local Chinese resume tailoring agent for BOSS job descriptions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "langchain-core>=0.2",
  "langgraph>=0.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
documents = ["python-docx>=1.1", "PyMuPDF>=1.24"]
mcp = ["mcp==1.12.4", "playwright>=1.45", "websockets>=15"]
ocr = ["paddleocr>=3.7,<4", "paddlepaddle>=3.3,<4", "Pillow>=10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
resume-agent-api = "app.main:run"
resume-agent-ui = "app.ui.streamlit_app:main"
resume-agent-boss-mcp = "app.mcp.boss_server:main"
resume-agent-github-mcp = "app.mcp.github_server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
